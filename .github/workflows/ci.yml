name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: ShellCheck
        run: |
          shellcheck -x -e SC1091,SC2034 \
            rootfs/opt/scrcpy-web/bin/*.sh rootfs/opt/scrcpy-web/bin/set-display-size \
            tests/*.sh scripts/*.sh

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Python lint and unit tests
        run: |
          pip install aiohttp pyflakes
          python -m pyflakes rootfs/opt/scrcpy-web tests
          python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: scrcpy-web:test
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests inside the image
        run: tests/run-unit-tests.sh scrcpy-web:test

      - name: Smoke test
        run: tests/smoke.sh scrcpy-web:test
