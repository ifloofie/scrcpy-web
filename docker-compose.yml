# scrcpy-web - control a USB-connected Android phone from your browser.
#
#   1. cp .env.example .env   (set BIND_ADDRESS and WEB_PASSWORD)
#   2. docker compose up -d
#   3. open http://<BIND_ADDRESS>:8080 and accept "Allow USB debugging" on the phone
#
# It is reachable from your local network only. See "Security" in README.md.
#
# See README.md for every option.
services:
  scrcpy-web:
    image: ghcr.io/ifloofie/scrcpy-web:latest
    # build: .                 # uncomment to build from this repo instead
    container_name: scrcpy-web
    restart: unless-stopped

    ports:
      # Web UI, published ONLY on BIND_ADDRESS (set it in .env to this server's
      # LAN IP, e.g. 192.168.1.50). Never use a bare "8080:8080": that listens
      # on every interface, including public IPv6 addresses, and Docker
      # bypasses ufw. Also never port-forward 8080 on your router.
      - "${BIND_ADDRESS:?Set BIND_ADDRESS in .env to this server's LAN IP address (e.g. 192.168.1.50)}:8080:8080"
      # Native VNC apps (only listens when VNC_PASSWORD is set)
      # - "${BIND_ADDRESS}:5900:5900"
      # ADB server for scrcpy/adb on another computer (needs ADB_EXPOSE=true)
      # - "${BIND_ADDRESS}:5037:5037"

    env_file:
      - path: .env
        required: false

    volumes:
      # ADB keys (so "Always allow" is remembered), generated passwords, sessions
      - scrcpy-web-data:/data
      # USB access. Bind-mounting the whole bus plus the cgroup rule below keeps
      # working when the phone reboots or is replugged (it gets a new device node).
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"   # 189 = USB devices

    # Hardening: none of the services need extra privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  scrcpy-web-data:
