; Process supervision for scrcpy-web. Every service is restarted if it exits.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/scrcpy-web/supervisord.pid

[unix_http_server]
file=/run/scrcpy-web/supervisor.sock
chmod=0700
; No credentials: the socket is only reachable by root inside this container.
; (supervisord logs a CRIT line about this at startup; it is expected.)

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/scrcpy-web/supervisor.sock

; Virtual X display with a built-in VNC server (TigerVNC)
[program:xvnc]
command=/opt/scrcpy-web/bin/run-xvnc.sh
priority=10
autorestart=true
startretries=1000
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ADB server, owns the USB connection to the phone
[program:adb]
command=/opt/scrcpy-web/bin/run-adb.sh
priority=10
autorestart=true
startretries=1000
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; scrcpy itself: waits for the device, restarts on disconnect
[program:scrcpy]
command=/opt/scrcpy-web/bin/run-scrcpy.sh
priority=20
autorestart=true
startretries=1000
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Keeps the virtual display the same shape as the phone when it rotates
[program:display-sync]
command=python3 /opt/scrcpy-web/bin/display_sync.py
priority=30
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Web UI, control API and VNC-over-WebSocket proxy
[program:web]
command=python3 /opt/scrcpy-web/app/server.py
priority=40
autorestart=true
startretries=1000
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
